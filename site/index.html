<html lang="en">

    <meta charset="UTF-8">

<body>
    
    <div id="map"></div>
    <!-- Javascript must be performed after script inclusion and div -->
     <!-- 'https://{s}.somedomain.com/blabla/{z}/{x}/{y}{r}.png' -->
     <!-- {s} means one of the available subdomains (used sequentially to help with browser parallel requests per domain limitation; subdomain values are specified in options; a, b or c by default, can be omitted), {z} — zoom level, {x} and {y} — tile coordinates. {r} can be used to add "@2x" to the URL to load retina tiles. -->
    <script>
        // map.attributionControl.setPrefix('<a href="https://leafletjs.com/">Leaflet</a>');
        // https://groups.google.com/g/leaflet-js/c/fA6M7fbchOs/m/JTNVhqdc7JcJ
        var Overworld = L.tileLayer('map/overworld/{z}/{x}/{y}.png', {
            noWrap: true,
            tileSize: (128), // Previously multiplied by 16
            // Subtract everything by 4 to get propery scaling (2^4 = 16 which was the previous scaling applied on tileSize)
            minZoom: 0-4,
            maxNativeZoom: 4-4,
            minNativeZoom:0-4,
            maxZoom: 8-4,
            zoomOffset: 4,
            attribution: 'Overworld | pixle\'s Vanilla Server',
            keepBuffer: 4
        });
        var Nether = L.tileLayer('map/nether/{z}/{x}/{y}.png', {
            noWrap: true,
            tileSize: (128),
            minZoom: 0-4,
            maxNativeZoom: 4-4,
            minNativeZoom:0-4,
            maxZoom: 8-4,
            zoomOffset: 4,
            attribution: 'Nether | pixle\'s Vanilla Server',
            keepBuffer: 4
        });
        var End = L.tileLayer('map/end/{z}/{x}/{y}.png', {
            noWrap: true,
            tileSize: (128),
            minZoom: 0-4,
            maxNativeZoom: 4-4,
            minNativeZoom:0-4,
            maxZoom: 8-4,
            zoomOffset: 4,
            attribution: 'End | pixle\'s Vanilla Server',
            keepBuffer: 4
        });
        var baseMaps = {
            "Overworld": Overworld,
            "Nether": Nether,
            "End": End
        };
        
        var map = L.map('map', 
            {
                crs: L.CRS.Simple, 
                layers: [Overworld],
                maxBoundsViscosity: 1.0
            });
        map.attributionControl.setPrefix('');
        var layerControl = L.control.layers(baseMaps, null, {collapsed:false}).addTo(map);

        // map.setMaxBounds([[-1000, -1000], [1000, 1000]]);
        var precision = 10 // I forgot what this does
        function mcXYTomapXY(coord) {
            // First is z, second is x. coord[1] is z coord[0] is x. Confusing lol I keep expecting x, z not z, x
            return [(Math.floor((-coord[1] - 64) * precision) / precision), (Math.floor((coord[0] + 64) * precision) / precision)];
        }
        map.setMaxBounds([mcXYTomapXY([-29999984, -29999984]), mcXYTomapXY([29999984, 29999984])]);

        // Sets the view to have the world's 0,0 in teh center
        map.setView(mcXYTomapXY([0,0]), 0)

        // A popup that shows the current coordinate your mouse is at. Useful if you need to mark something for reference
        // var popup = L.popup();
        // function onMapClick(e) {
        //     if(map.hasLayer(Overworld) || map.hasLayer(End));
        //         popup
        //         .setLatLng(e.latlng)
        //         .setContent("x: " + Math.floor((e.latlng.lng - 64) * precision) / precision + ", z: " + Math.floor((-e.latlng.lat - 64) * precision) / precision)
        //         .openOn(map);
            
        //     if(map.hasLayer(Nether))
        //         popup
        //         .setLatLng(e.latlng)
        //         .setContent("Overworld x: " + (Math.floor((e.latlng.lng - 64) * precision) / precision)/8 + ", z: " + (Math.floor((-e.latlng.lat - 64) * precision) / precision)/8)
        //         .openOn(map);
        // }
        // map.on('click', onMapClick);

        function onMouseMoving(e) {
            map.attributionControl.setPrefix("x: " + Math.floor((e.latlng.lng - 64) * precision) / precision + ", z: " + Math.floor((-e.latlng.lat - 64) * precision) / precision);
        }
        map.on('mousemove', onMouseMoving);

        function currentLayerText() {
            return map.hasLayer(Overworld) ? "overworld" : map.hasLayer(Nether) ? "nether" : "end";
        }

        
        //////////////////////////
        //      Share Code      //
        //////////////////////////

        const param = new URLSearchParams(window.location.search);
        console.log(param)
        if( param.has("x") && param.has("z") && param.has("zoom") )
        {
            map.setView([param.get("x"),param.get("z")], param.get("zoom"));
            // console.log(param.get("x"));
            console.log("Test")
        }
        function updateURL() {
            const url = new URL(window.location);
            url.searchParams.set('x', map.getCenter().lat + 1);
            url.searchParams.set('z', map.getCenter().lng);
            url.searchParams.set('zoom', map.getZoom());
            window.history.replaceState({}, '', url);
        }

        map.on('moveend', updateURL);




        //////////////////////////
        //     Banner Code      //
        //////////////////////////
        // Extension of icon to show minecraft banners
        const Banner = L.Icon.extend({
            options: {
                iconSize: [16, 16], // Size of the icon
                iconAnchor: [8, 8], // Set this to half of above to center banner
                color: 'black'
            },

            createIcon: function (oldIcon) {
                this.options.iconUrl = `icons/banners/${this.options.color}_banner.png`;
                return L.Icon.prototype.createIcon.call(this, oldIcon);
            }
        });

        // Generates all the banners and stores them
        const bannerMarkers = L.layerGroup().addTo(map);
        
        function displayBanners() {
            bannerMarkers.clearLayers();
            fetch(`map/${currentLayerText()}/banners.json`)
                .then(response => response.json())
                .then(data => {
                    data.forEach(banner => {
                        var mark = new L.marker(mcXYTomapXY([banner.pos[0],banner.pos[2]]), {icon: new Banner({color: banner.color})}).addTo(bannerMarkers);
                        if(banner.hasOwnProperty("name"))
                            mark.bindTooltip(banner.name, 
                        {
                            permanent: true,
                            direction: 'bottom',
                            offset: [0, 8],
                            className: 'banner-tooltip'
                        });
                        mark.closeTooltip();
                    });
                })
                .catch(error => console.error("Error loading Json", error));
        };
        displayBanners();
        
        // Changes the visible icons when a different dimension is chosen.
        map.on("baselayerchange", displayBanners)

        //////////////////////////
        //     Player Code      //
        //////////////////////////
        
        // Generates all the heads and stores them
        const playerMarkers = L.layerGroup().addTo(map);

        // Extension of icon to show player heads
        const Head = L.Icon.extend({
            options: {
                iconSize: [24, 24], // Size of the icon
                iconAnchor: [12, 12], // Set this to half of above to center icon
                name: 'Steve'
            },
            createIcon: function (oldIcon) {
                this.options.iconUrl = `https://api.mcheads.org/head/${this.options.name}/32`;
                return L.Icon.prototype.createIcon.call(this, oldIcon);
            }
        });
        const players = [];

        function displayPlayers() {
            playerMarkers.clearLayers();
            fetch(`map/${currentLayerText()}/players.json`)
                .then(response => response.json())
                .then(data => {
                    Object.entries(data).forEach(([name, player]) => {
                        const mark = new L.marker(mcXYTomapXY([player.Pos[0],player.Pos[2]]), {icon: new Head({name: name})}).addTo(playerMarkers).bindPopup("x: " + player.Pos[0] + ", z: " + player.Pos[2]);
                        mark.bindTooltip(name, 
                        {
                            permanent: true,
                            direction: 'bottom',
                            offset: [0, 12],
                            className: 'banner-tooltip'
                        });
                        // console.log(name);
                        mark.closeTooltip();
                    });
                })
                .catch(error => console.error("Error loading Json", error));
        };
        displayPlayers();

        // Changes the visible icons when a different dimension is chosen.
        map.on("baselayerchange", displayPlayers)

        //         const players = await response.json();
        //         const currentData = JSON.stringify(players);

        //         if (currentData !== previousData) {
        //             previousData = currentData;

        //             console.log("Player data changed:", players);

        //             updatePlayerMarkers(players);
        //         }
        //     } catch (error) {
        //         console.error("Could not update player data:", error);
        //     }
        // }

        // function updatePlayerMarkers(players) {

        // }

        // pollPlayers();
        // setInterval(pollPlayers, 2000);
        ////////////////////////////////////////////



        // Only show the names of the banners/players when zoomed in enough
        function updateTooltips() {
            const show = map.getZoom() >= 1;

            bannerMarkers.eachLayer(marker => {
                if (show) {
                marker.openTooltip();
                } else {
                marker.closeTooltip();
                }
            });
            playerMarkers.eachLayer(marker => {
                if (show) {
                marker.openTooltip();
                } else {
                marker.closeTooltip();
                }
            });
        }
        
        map.on("zoomend", updateTooltips);


        
    </script>
</body>
